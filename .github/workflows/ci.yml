name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CI Environment
        run: node scripts/generate-ci-env.mjs

      - name: Lint
        # Continuing on error because of existing technical debt
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        # Continuing on error because of existing technical debt
        run: pnpm typecheck
        continue-on-error: true

      - name: Run Tests
        # Unit tests only
        run: pnpm test

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CI Environment
        run: node scripts/generate-ci-env.mjs

      - name: Build App
        # Verifies the full Next.js build
        run: pnpm build

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CI Environment
        run: node scripts/generate-ci-env.mjs

      - name: Build Storybook
        # Ensures UI components are buildable
        run: pnpm build-storybook
